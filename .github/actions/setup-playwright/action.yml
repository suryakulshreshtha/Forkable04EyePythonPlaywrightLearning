# A COMPOSITE ACTION: a reusable block of steps, versioned with your repo.
#
# Why bother? These six steps appear in four workflows. Without this file you
# maintain the same caching logic in four places and they drift. With it,
# changing the cache key is a one-line edit.
name: Setup Python and Playwright
description: Install Python, restore caches, install deps and browser binaries.

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.12"
  browser:
    description: Which browser binary to install (chromium | firefox | webkit | all)
    required: false
    default: chromium
  install-dev:
    description: Also install requirements-dev.txt (linters)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}
        # Built-in pip caching keyed on the requirements files. Free ~30s.
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ "${{ inputs.install-dev }}" = "true" ]; then
          pip install -r requirements-dev.txt
        else
          pip install -r requirements.txt
        fi

    # Browser binaries are ~400MB and take 60-90s to download. Cache them.
    # The key includes the resolved Playwright version so an upgrade busts the
    # cache automatically -- a stale browser against a new client is a horrible
    # class of bug to debug.
    - name: Resolve Playwright version
      id: pw
      shell: bash
      run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: pw-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ms-playwright
        key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ inputs.browser }}

    - name: Install browser binaries (cache miss)
      if: steps.pw-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        if [ "${{ inputs.browser }}" = "all" ]; then
          python -m playwright install --with-deps
        else
          python -m playwright install --with-deps ${{ inputs.browser }}
        fi

    # Even on a cache hit we must install the OS-level shared libraries,
    # because those live outside ~/.cache and are not cached.
    - name: Install OS dependencies (cache hit)
      if: steps.pw-cache.outputs.cache-hit == 'true'
      shell: bash
      run: python -m playwright install-deps ${{ inputs.browser == 'all' && '' || inputs.browser }}
